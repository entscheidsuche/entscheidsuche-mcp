      fr: ["Recherche standard", "La recherche pour tous les cas. Décrivez la question juridique ou les faits en langage naturel, dans n'importe quelle langue : l'outil exécute la recherche IA par le sens (comme semantic_search) et fournit pour chaque décision le passage le plus pertinent.\n\nIl passe automatiquement à la recherche par mots-clés (comme keyword_search) lorsque la requête est un numéro de dossier ou une citation (p. ex. 5A_396/2015, BGE 142 III 1), contient une expression entre guillemets, des opérateurs booléens ou des caractères génériques, est vide ou vaut *, ou lorsque sort, search_after ou include_aggregations est utilisé. Le champ de réponse search_mode indique la recherche exécutée.\n\nUn résultat ne contient qu'un extrait. Avant d'indiquer ce qu'une décision retient, il faut en lire le texte intégral avec fetch (ou fetch_document) et l'id du résultat."],
      it: ["Ricerca standard", "La ricerca per tutti i casi. Descrivete la questione giuridica o i fatti in linguaggio naturale, in qualsiasi lingua: lo strumento esegue la ricerca IA per significato (come semantic_search) e fornisce per ogni decisione il passaggio più pertinente.\n\nPassa automaticamente alla ricerca per parole chiave (come keyword_search) quando la richiesta è un numero di incarto o una citazione (p. es. 5A_396/2015, BGE 142 III 1), contiene un'espressione tra virgolette, operatori booleani o caratteri jolly, è vuota o vale *, oppure quando si usa sort, search_after o include_aggregations. Il campo di risposta search_mode indica la ricerca eseguita.\n\nUn risultato contiene solo un estratto. Prima di riferire che cosa stabilisce una decisione, occorre leggerne il testo integrale con fetch (o fetch_document) e l'id del risultato."]

    semantic_search: {
      de: ["KI-Suche nach Bedeutung", "Sucht nicht nach Wörtern, sondern nach Bedeutung (Embeddings) – dasselbe Verfahren wie die Schaltfläche «KI-Suche» auf entscheidsuche.ch. Am besten geeignet für Rechtsfragen und Sachverhalte in ganzen Sätzen. Eine deutsche Anfrage findet auch französische und italienische Entscheide.\n\nAusgewertet werden die 100 am besten passenden Textabschnitte; mehrere Abschnitte desselben Entscheids ergeben einen Treffer. Die Treffer sind nach inhaltlicher Nähe geordnet (score); text enthält den am besten passenden Abschnitt. Keine Paginierung, keine andere Sortierung, keine Boolesche Syntax."],
      fr: ["Recherche IA par le sens", "Ne cherche pas des mots, mais le sens (embeddings) – le même procédé que le bouton « Rechercher IA » sur entscheidsuche.ch. Convient le mieux aux questions juridiques et aux faits décrits en phrases complètes. Une requête en français trouve aussi des décisions en allemand et en italien.\n\nLes 100 passages les plus pertinents sont évalués ; plusieurs passages d'une même décision donnent un seul résultat. Les résultats sont classés par proximité de sens (score) ; text contient le passage le plus pertinent. Pas de pagination, pas d'autre tri, pas de syntaxe booléenne."],
      it: ["Ricerca IA per significato", "Non cerca parole, ma il significato (embedding) – lo stesso procedimento del pulsante «Ricercare IA» su entscheidsuche.ch. Adatta soprattutto a questioni giuridiche e fatti descritti in frasi complete. Una richiesta in italiano trova anche decisioni in tedesco e in francese.\n\nVengono valutati i 100 passaggi più pertinenti; più passaggi della stessa decisione danno un solo risultato. I risultati sono ordinati per vicinanza di significato (score); text contiene il passaggio più pertinente. Nessuna paginazione, nessun altro ordinamento, nessuna sintassi booleana."]
    },
    keyword_search: {
      de: ["Stichwortsuche", "Findet Entscheide, die die angegebenen Wörter enthalten. Geeignet für bestimmte Begriffe, Gesetzesartikel, Namen, Phrasen, vollständige Trefferlisten, Sortierung nach Datum und Paginierung.\n\nSyntax (Lucene): alle Begriffe müssen vorkommen (AND) · Phrase in Anführungszeichen: \"dringender Eigenbedarf\" · Operatoren in Grossbuchstaben: AND, OR, NOT · Wildcards * und ? (* allein findet alle Entscheide) · Gesetzesartikel wie geschrieben: Art. 271 OR · Geschäftsnummern in Anführungszeichen.\n\nIst die Anfrage keine gültige Syntax, wird sie als gewöhnliche Suchbegriffe ausgeführt; die Antwort weist darauf hin. text enthält einen Auszug mit den Fundstellen. Paginierung: next_cursor der Antwort als search_after im nächsten Aufruf übergeben."],
      fr: ["Recherche par mots-clés", "Trouve les décisions qui contiennent les mots indiqués. Convient pour des termes précis, des articles de loi, des noms, des expressions, des listes de résultats complètes, le tri par date et la pagination.\n\nSyntaxe (Lucene) : tous les termes doivent figurer (AND) · expression entre guillemets : \"besoin propre\" · opérateurs en majuscules : AND, OR, NOT · caractères génériques * et ? (* seul trouve toutes les décisions) · numéros de dossier entre guillemets.\n\nSi la requête n'est pas une syntaxe valide, elle est exécutée comme des termes ordinaires ; la réponse le signale. text contient un extrait avec les occurrences. Pagination : transmettre next_cursor de la réponse comme search_after dans l'appel suivant."],
      it: ["Ricerca per parole chiave", "Trova le decisioni che contengono le parole indicate. Adatta per termini precisi, articoli di legge, nomi, espressioni, elenchi completi di risultati, ordinamento per data e paginazione.\n\nSintassi (Lucene): tutti i termini devono comparire (AND) · espressione tra virgolette: \"bisogno personale\" · operatori in maiuscolo: AND, OR, NOT · caratteri jolly * e ? (* da solo trova tutte le decisioni) · numeri di incarto tra virgolette.\n\nSe la richiesta non è una sintassi valida, viene eseguita come normali termini di ricerca; la risposta lo segnala. text contiene un estratto con le occorrenze. Paginazione: trasmettere next_cursor della risposta come search_after nella chiamata successiva."]

      fr: ["Recherche par numéro de dossier", "Recherche un numéro de dossier, une référence ou une citation ATF comme expression exacte, p. ex. BGE 142 III 1, 5A_396/2015 ou ZB.2021.48. La décision elle-même figure en général en premier, suivie des décisions qui la citent."],
      it: ["Ricerca per numero di incarto", "Cerca un numero di incarto, un riferimento o una citazione DTF come espressione esatta, p. es. BGE 142 III 1, 5A_396/2015 o ZB.2021.48. Di regola compare per prima la decisione stessa, seguita dalle decisioni che la citano."]

      it: ["Ottenere una decisione (testo integrale)", "Fornisce una singola decisione in base al suo identificativo di documento, con testo integrale, titolo, tribunale, data e link. L'identificativo proviene dal campo id di un risultato di ricerca. Per decisioni molto lunghe il testo è limitato a 100'000 caratteri; se text_truncated è impostato, il documento completo si trova sotto document_url."]

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (key) {
      if (key === "class") node.className = attrs[key];
      else if (key === "text") node.textContent = attrs[key];
      else if (key.slice(0, 2) === "on") node.addEventListener(key.slice(2), attrs[key]);
      else if (attrs[key] !== false && attrs[key] != null) node.setAttribute(key, attrs[key] === true ? "" : attrs[key]);
    });
    (children || []).forEach(function (child) {
      if (child != null) node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
    });
    return node;
  }

  function post(body) {
    var started = performance.now();
    return fetch(endpointInput.value.trim(), {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json, text/event-stream", "MCP-Protocol-Version": PROTOCOL },
      body: JSON.stringify(body)
    }).then(function (response) {
      return response.text().then(function (text) {
        var ms = Math.round(performance.now() - started);
        var data = null;
        var payload = text;
        // Antwort als Server-Sent Events: die JSON-Nachricht steht in den data:-Zeilen
        if ((response.headers.get("content-type") || "").indexOf("text/event-stream") === 0) {
          payload = text.split(/\r?\n/).filter(function (l) { return l.indexOf("data:") === 0; })
            .map(function (l) { return l.slice(5).trim(); }).join("");
        }
        try { data = payload ? JSON.parse(payload) : null; } catch (e) { data = null; }
        return { status: response.status, ms: ms, bytes: new Blob([text]).size, text: text, data: data,
                 contentType: response.headers.get("content-type") || "" };
      });
    });
  }

    var json = JSON.stringify(body).replace(/'/g, "'\\''");
    return "curl -s -X POST '" + endpointInput.value.trim() + "' \\\n" +
      "  -H 'Content-Type: application/json' \\\n" +
      "  -H 'Accept: application/json, text/event-stream' \\\n" +
      "  -d '" + json + "'";
  }

  // ---- Schema → Formular -------------------------------------------------
  function resolve(schema, root) {
    if (schema && schema.$ref) {
      var name = schema.$ref.split("/").pop();
      return resolve(((root.$defs || root.definitions || {})[name]) || {}, root);
    }
    return schema || {};
  }

  // Liefert {type, enum, items, format, nullable} für ein Property-Schema.
  function describe(schema, root) {
    schema = resolve(schema, root);
    var nullable = false;
    if (schema.anyOf) {
      var options = schema.anyOf.map(function (s) { return resolve(s, root); });
      nullable = options.some(function (s) { return s.type === "null"; });
      var real = options.filter(function (s) { return s.type !== "null"; })[0] || {};
      var merged = {};
      Object.keys(real).forEach(function (k) { merged[k] = real[k]; });
      schema = merged;
    }
    var info = { type: schema.type || "any", "enum": schema["enum"], format: schema.format, nullable: nullable,
                 minimum: schema.minimum, maximum: schema.maximum };
    if (schema.type === "array") {
      var items = resolve(schema.items || {}, root);
      info.items = { type: items.type || "any", "enum": items["enum"] };
    }
    return info;
  }

  function typeLabel(info) {
    var label = info.type;
    if (info["enum"]) label = info["enum"].map(function (v) { return JSON.stringify(v); }).join(" | ");
    if (info.type === "array") label = "array<" + (info.items["enum"] ? info.items["enum"].join(" | ") : info.items.type) + ">";
    if (info.format) label += " ($" + info.format + ")";
    if (info.type === "integer" && (info.minimum != null || info.maximum != null)) label += " [" + (info.minimum != null ? info.minimum : "") + "…" + (info.maximum != null ? info.maximum : "") + "]";
    return label;
  }

  // Erzeugt das Eingabe-Element; gibt {node, get(), set(value)} zurück.
  function control(name, info) {
    var node, get, set;
    if (info["enum"]) {
      node = el("select", { name: name }, [el("option", { value: "", text: "–" })].concat(
        info["enum"].map(function (v) { return el("option", { value: String(v), text: String(v) }); })));
      get = function () { return node.value === "" ? undefined : node.value; };
      set = function (v) { node.value = v == null ? "" : String(v); };
    } else if (info.type === "boolean") {
      node = el("select", { name: name }, [el("option", { value: "", text: "–" }), el("option", { value: "true", text: "true" }), el("option", { value: "false", text: "false" })]);
      get = function () { return node.value === "" ? undefined : node.value === "true"; };
      set = function (v) { node.value = v == null ? "" : String(v); };
    } else if (info.type === "integer" || info.type === "number") {
      node = el("input", { type: "number", name: name, min: info.minimum, max: info.maximum });
      get = function () { return node.value === "" ? undefined : Number(node.value); };
      set = function (v) { node.value = v == null ? "" : v; };
    } else if (info.type === "array" && info.items["enum"]) {
      var boxes = info.items["enum"].map(function (v) {
        var box = el("input", { type: "checkbox", value: v });
        return { box: box, label: el("label", {}, [box, " " + v]) };
      });
      node = el("div", { "class": "checks" }, boxes.map(function (b) { return b.label; }));
      get = function () {
        var values = boxes.filter(function (b) { return b.box.checked; }).map(function (b) { return b.box.value; });
        return values.length ? values : undefined;
      };
      set = function (v) { boxes.forEach(function (b) { b.box.checked = !!v && v.indexOf(b.box.value) >= 0; }); };
    } else if (info.type === "array" && info.items.type === "string") {
      node = el("input", { type: "text", name: name, placeholder: t("phList") });
      get = function () {
        var values = node.value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
        return values.length ? values : undefined;
      };
      set = function (v) { node.value = v == null ? "" : v.join(", "); };
    } else if (info.type === "array" || info.type === "object" || info.type === "any") {
      node = el("input", { type: "text", name: name, placeholder: t("phJson") });
      get = function () {
        if (node.value.trim() === "") return undefined;
        try { return JSON.parse(node.value); } catch (e) { throw new Error(t("badJson", { name: name })); }
      };
      set = function (v) { node.value = v == null ? "" : JSON.stringify(v); };
    } else {
      node = el("input", { type: info.format === "date" ? "date" : "text", name: name });
      get = function () { return node.value === "" ? undefined : node.value; };
      set = function (v) { node.value = v == null ? "" : v; };
    }
    return { node: node, get: get, set: set };
  }

  // ---- Ergebnis-Darstellung ---------------------------------------------
  function highlight(text) {
    // alles maskieren, nur die <em>-Hervorhebungen der Suche wieder zulassen
    var span = el("span", {});
    span.textContent = text == null ? "" : String(text);
    span.innerHTML = span.innerHTML.replace(/&lt;em&gt;/g, "<mark>").replace(/&lt;\/em&gt;/g, "</mark>");
    return span;
  }

  function hitCard(hit, index) {
    var meta = [hit.id, hit.decision_date, hit.court, hit.is_pdf ? "PDF" : null,
                hit.score != null ? "score " + hit.score : null].filter(Boolean).join(" · ");
    var title = el("a", { "class": "t", href: hit.url || hit.document_url || "#", target: "_blank", rel: "noopener" }, [highlight((index + 1) + ". " + (hit.title || hit.id))]);
    var text = (hit.text || "").replace(/[ \t ]*\n\s*/g, "\n").trim();
    var body = text ? el("div", { "class": "x" }, [highlight(text.length > 1500 ? text.slice(0, 1500) + " …" : text)])
                    : el("div", { "class": "x none", text: t("noExcerpt") });
    var card = el("div", { "class": "hit" }, [title, el("div", { "class": "m", text: meta }), body]);
    if (hit.abstract) card.insertBefore(el("div", { "class": "pdesc" }, [highlight(hit.abstract)]), body);
    if (hit.context) card.appendChild(el("details", {}, [el("summary", { text: t("context", { n: number(hit.context.length) }) }), el("div", { "class": "x", text: hit.context })]));
    return card;
  }

  function renderResult(result) {
    var box = el("div", {});
    if (!result) { box.appendChild(el("div", { "class": "summary", text: t("noData") })); return box; }
    if (result.isError) {
      var message = (result.content || []).map(function (c) { return c.text || ""; }).join("\n");
      box.appendChild(el("div", { "class": "errbox", text: message || t("noMessage") }));
      return box;
    }
    var data = result.structuredContent;
    if (data && data.result !== undefined && Object.keys(data).length === 1) data = data.result;
    if (data && Array.isArray(data.hits)) {
      // Der Hinweis ist Ausgabe des Servers und bleibt im Original (englisch).
      if (data.note) box.appendChild(el("div", { "class": "note" }, [el("b", { text: t("serverNote") + " " }), data.note]));
      box.appendChild(el("div", { "class": "summary", text:
        t("summary", { mode: data.search_mode === "semantic" ? t("modeSemantic") : t("modeKeyword"), total: number(data.total), n: data.hits.length }) +
        (data.next_cursor ? " · next_cursor: " + JSON.stringify(data.next_cursor) : "") }));
      data.hits.forEach(function (hit, i) { box.appendChild(hitCard(hit, i)); });
      if (data.aggregations) {
        box.appendChild(el("details", {}, [el("summary", { text: t("aggregations") }),
          el("pre", { "class": "code", text: JSON.stringify(data.aggregations, null, 2) })]));
      }
    } else if (data && typeof data.text === "string" && data.id) {
      box.appendChild(hitCard({ id: data.id, title: data.title, url: data.url, document_url: data.document_url,
        decision_date: data.decision_date, court: data.court, is_pdf: data.is_pdf, abstract: data.abstract, text: " " }, 0));
      box.lastChild.removeChild(box.lastChild.lastChild);
      box.appendChild(el("div", { "class": "summary", text: t("fullText", { n: number(data.text.length) }) + (data.text_truncated ? t("truncated") : "") }));
      box.appendChild(el("pre", { "class": "code", text: data.text.replace(/[ \t ]*\n\s*\n\s*/g, "\n\n").trim() }));
    } else if (data !== undefined && data !== null) {
      box.appendChild(el("pre", { "class": "code", text: JSON.stringify(data, null, 2) }));
    } else {
      box.appendChild(el("pre", { "class": "code", text: (result.content || []).map(function (c) { return c.text || ""; }).join("\n") }));
    }
    return box;
  }

  function codeBlock(text) {
    var pre = el("pre", { "class": "code", text: text });
    var copy = el("button", { "class": "btn small copy", type: "button", text: t("copy"), onclick: function () {
      navigator.clipboard.writeText(text).then(function () { copy.textContent = t("copied"); setTimeout(function () { copy.textContent = t("copy"); }, 1200); });
    } });
    return el("div", { "class": "codewrap" }, [copy, pre]);
  }

  function showResponse(container, body, answer, isTool) {
    container.innerHTML = "";
    container.appendChild(el("h4", { text: "curl" })); container.appendChild(codeBlock(curlFor(body)));
    container.appendChild(el("h4", { text: t("request") })); container.appendChild(codeBlock(JSON.stringify(body, null, 2)));
    if (!answer) return;
    var rpcError = answer.data && answer.data.error;
    var toolError = answer.data && answer.data.result && answer.data.result.isError;
    var bad = answer.status >= 400 || rpcError || toolError;
    container.appendChild(el("div", { "class": "meta" }, [
      el("span", { "class": "code-pill" + (bad ? " bad" : ""), text: "HTTP " + answer.status + (rpcError ? " · " + t("rpcError", { code: rpcError.code }) : toolError ? " · isError" : "") }),
      el("span", { text: answer.ms + " ms" }),
      el("span", { text: number(answer.bytes) + " Bytes" }),
      el("span", { text: answer.contentType })
    ]));
    var panes = [];
    if (isTool && answer.data && answer.data.result) {
      panes.push([t("tabResult"), renderResult(answer.data.result)]);
      if (answer.data.result.structuredContent !== undefined) panes.push(["structuredContent", codeBlock(JSON.stringify(answer.data.result.structuredContent, null, 2))]);
    }
    panes.push([t("tabRaw"), codeBlock(answer.data ? JSON.stringify(answer.data, null, 2) : answer.text)]);
    var tabs = el("div", { "class": "tabs" });
    container.appendChild(tabs);
    panes.forEach(function (pane, i) {
      var paneNode = el("div", { "class": "pane" + (i === 0 ? " on" : "") }, [pane[1]]);
      var button = el("button", { type: "button", "class": i === 0 ? "on" : "", text: pane[0], onclick: function () {
        Array.prototype.forEach.call(tabs.children, function (b) { b.classList.remove("on"); });
        Array.prototype.forEach.call(container.querySelectorAll(".pane"), function (p) { p.classList.remove("on"); });
        button.classList.add("on"); paneNode.classList.add("on");
      } });
      tabs.appendChild(button); container.appendChild(paneNode);
    });
  }

  function run(button, container, body, isTool) {
    button.disabled = true; var label = button.textContent; button.textContent = t("running");
    showResponse(container, body, null, isTool);
    post(body).then(function (answer) { showResponse(container, body, answer, isTool); })
      .catch(function (error) { container.appendChild(el("div", { "class": "errbox", text: t("requestFailed", { msg: error.message }) })); })
      .then(function () { button.disabled = false; button.textContent = label; });
  }

  // ---- Tools -------------------------------------------------------------
  function toolText(tool) {
    var local = TOOLS[tool.name] && TOOLS[tool.name][lang];
    return { title: local ? local[0] : (tool.title || ""), description: local ? local[1] : (tool.description || ""), localized: !!local };
  }

  function paramText(tool, name, prop) {
    var table = PARAMS[lang] || {};
    return table[tool.name + "." + name] || table[name] || prop.description || "";
  }

  function toolBlock(tool) {
    var schema = tool.inputSchema || {};
    var required = schema.required || [];
    var controls = {};
    var texts = toolText(tool);
    var rows = Object.keys(schema.properties || {}).map(function (name) {
      var prop = schema.properties[name];
      var info = describe(prop, schema);
      var ctl = controls[name] = control(name, info);
      var isRequired = required.indexOf(name) >= 0;
      var def = prop["default"];
      var description = paramText(tool, name, prop);
      return el("tr", {}, [
        el("td", { "class": "pname" }, [el("b", { text: name }), isRequired ? el("span", { "class": "req", text: "* " + t("required") }) : null, el("span", { "class": "ptype", text: typeLabel(info) })]),
        el("td", {}, [
          description ? el("div", { "class": "pdesc", text: description }) : null,
          ctl.node,
          def !== undefined && def !== null && def !== "" ? el("div", { "class": "pdef", text: t("defaultValue", { v: JSON.stringify(def) }) }) : null
        ])
      ]);
    });
    var response = el("div", { "class": "resp" });
    function fill(args) { Object.keys(controls).forEach(function (name) { controls[name].set(args[name]); }); }
    var examples = (EXAMPLES[tool.name] || []).map(function (example) {
      return el("button", { "class": "btn small", type: "button", text: t(example.label), onclick: function () { fill(example.args); } });
    });
    var exec = el("button", { "class": "exec", type: "submit", text: t("execute") });
    var form = el("form", { onsubmit: function (event) {
      event.preventDefault();
      var args = {};
      try {
        Object.keys(controls).forEach(function (name) { var value = controls[name].get(); if (value !== undefined) args[name] = value; });
      } catch (error) { response.innerHTML = ""; response.appendChild(el("div", { "class": "errbox", text: error.message })); return; }
      run(exec, response, request("tools/call", { name: tool.name, arguments: args }), true);
    } }, [
      el("div", { "class": "bar" }, [t("params"), el("span", { "class": "ex" }, examples.length ? [el("span", { "class": "pdef", text: t("examples") })].concat(examples) : [])]),
      rows.length ? el("table", { "class": "params" }, [el("thead", {}, [el("tr", {}, [el("th", { text: t("colName") }), el("th", { text: t("colValue") })])]), el("tbody", {}, rows)])
                  : el("div", { "class": "desc pdef", text: t("noParams") }),
      el("div", { "class": "actions" }, [exec, el("button", { "class": "clear", type: "button", text: t("clear"), onclick: function () { fill({}); response.innerHTML = ""; } })])
    ]);
    var annotations = tool.annotations ? Object.keys(tool.annotations).filter(function (k) { return tool.annotations[k] === true; }).join(", ") : "";
    return el("details", { "class": "op", id: "tool-" + tool.name }, [
      el("summary", {}, [el("span", { "class": "badge", text: "TOOL" }), el("span", { "class": "op-name", text: tool.name }), el("span", { "class": "op-title", text: texts.title }), el("span", { "class": "chev", text: "▾" })]),
      el("div", { "class": "op-body" }, [
        el("div", { "class": "desc", text: texts.description }),
        annotations ? el("div", { "class": "desc pdef", style: "padding-top:0", text: t("annotations", { v: annotations }) }) : null,
        texts.localized ? el("details", { "class": "orig" }, [el("summary", { text: t("original") }), el("div", { text: (tool.title ? tool.title + "\n\n" : "") + (tool.description || "") })]) : null,
        form,
        el("div", { "class": "bar", text: t("response") }),
        response,
        el("details", { "class": "schema" }, [el("summary", { text: t("inputSchema") }), el("pre", { "class": "code", text: JSON.stringify(tool.inputSchema, null, 2) })]),
        tool.outputSchema ? el("details", { "class": "schema" }, [el("summary", { text: t("outputSchema") }), el("pre", { "class": "code", text: JSON.stringify(tool.outputSchema, null, 2) })]) : null
      ])
    ]);
  }

  function rpcBlock(spec) {
    var area = el("textarea", { spellcheck: "false" });
    area.value = spec.params == null ? "" : JSON.stringify(spec.params, null, 2);
    var response = el("div", { "class": "resp" });
    var exec = el("button", { "class": "exec", type: "submit", text: t("execute") });
    var form = el("form", { onsubmit: function (event) {
      event.preventDefault();
      var params = null;
      if (area.value.trim() !== "") {
        try { params = JSON.parse(area.value); } catch (e) { response.innerHTML = ""; response.appendChild(el("div", { "class": "errbox", text: t("badParams") })); return; }
      }
      run(exec, response, request(spec.method, params), false);
    } }, [
      el("div", { "class": "bar", text: t("rpcParams") }),
      el("div", { style: "padding:12px 18px 0" }, [area]),
      el("div", { "class": "actions" }, [exec])
    ]);
    return el("details", { "class": "op rpc" }, [
      el("summary", {}, [el("span", { "class": "badge", text: "RPC" }), el("span", { "class": "op-name", text: spec.method }), el("span", { "class": "op-title", text: t("rpc_" + spec.method.replace("/", "_")) }), el("span", { "class": "chev", text: "▾" })]),
      el("div", { "class": "op-body" }, [form, el("div", { "class": "bar", text: t("response") }), response])
    ]);
  }

  // ---- Aufbau und Sprache ------------------------------------------------
  function renderStatic() {
    document.documentElement.lang = lang;
    document.title = "entscheidsuche MCP – " + t("brandSub");
    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function (node) { node.innerHTML = t(node.getAttribute("data-t")); });
    Array.prototype.forEach.call(document.querySelectorAll(".langs button"), function (button) {
      button.setAttribute("aria-pressed", String(button.getAttribute("data-lang") === lang));
    });
    document.getElementById("doc-link").setAttribute("href", "/?lang=" + lang);
    var rpcBox = document.getElementById("rpc");
    rpcBox.innerHTML = "";
    RPC_METHODS.forEach(function (spec) { rpcBox.appendChild(rpcBlock(spec)); });
  }

  function renderTools() {
    var toolsBox = document.getElementById("tools");
    var status = document.getElementById("status");
    var open = Array.prototype.map.call(toolsBox.querySelectorAll("details.op[open]"), function (d) { return d.id; });
    toolsBox.innerHTML = "";
    if (!loaded) return;
    loaded.tools.forEach(function (tool) { toolsBox.appendChild(toolBlock(tool)); });
    open.forEach(function (id) { var d = document.getElementById(id); if (d) d.open = true; });
    document.getElementById("tool-count").textContent = t("toolCount", { n: loaded.tools.length, bytes: number(loaded.listBytes) });
    status.className = "status";
    status.textContent = t("connected", { url: endpointInput.value.trim(), a: loaded.initMs, b: loaded.listMs });
  }

  function load() {
    var status = document.getElementById("status");
    status.className = "status"; status.textContent = t("connecting", { url: endpointInput.value.trim() });
    loaded = null; renderTools(); document.getElementById("tool-count").textContent = "";
    post(request("initialize", RPC_METHODS[0].params)).then(function (init) {
      if (!init.data || !init.data.result) throw new Error("initialize: HTTP " + init.status + " " + init.text.slice(0, 200));
      var result = init.data.result;
      document.getElementById("srv-name").textContent = (result.serverInfo && result.serverInfo.name) || "MCP";
      document.getElementById("srv-ver").textContent = (result.serverInfo && result.serverInfo.version) || "";
      var proto = document.getElementById("srv-proto"); proto.hidden = false; proto.textContent = "MCP " + result.protocolVersion;
      return post(request("tools/list", {})).then(function (list) {
        if (!list.data || !list.data.result) throw new Error("tools/list: HTTP " + list.status);
        loaded = { tools: list.data.result.tools || [], listBytes: list.bytes, initMs: init.ms, listMs: list.ms };
        renderTools();
        var wanted = document.getElementById(location.hash.replace("#", ""));
        if (wanted && wanted.tagName === "DETAILS") { wanted.open = true; wanted.scrollIntoView(); }
      });
    }).catch(function (error) {
      status.className = "status bad";
      status.textContent = t("failed", { msg: error.message });
    });
  }

  function pickLanguage() {
    var fromUrl = (location.search.match(/[?&]lang=([a-z]{2})/) || [])[1];
    var stored = null;
    try { stored = localStorage.getItem("lang"); } catch (e) { /* Speicher nicht verfügbar */ }
    var fromBrowser = (navigator.language || "de").slice(0, 2).toLowerCase();
    var wanted = [fromUrl, stored, fromBrowser];
    for (var i = 0; i < wanted.length; i++) {
      if (wanted[i] && LANGS.indexOf(wanted[i]) >= 0) return wanted[i];
    }
    return "de";
  }

  Array.prototype.forEach.call(document.querySelectorAll(".langs button"), function (button) {
    button.addEventListener("click", function () {
      lang = button.getAttribute("data-lang");
      try { localStorage.setItem("lang", lang); } catch (e) { /* Speicher nicht verfügbar */ }
      renderStatic(); renderTools();
    });
  });
  document.getElementById("endpoint-form").addEventListener("submit", function (event) { event.preventDefault(); load(); });
  lang = pickLanguage();
  renderStatic();
  load();
})();
</script>
</body>

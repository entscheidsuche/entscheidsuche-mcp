# nginx-Konfiguration für mcp.entscheidsuche.ch
#
# Ablage:  /etc/nginx/sites-available/mcp.entscheidsuche.ch
# Aktivieren: ln -s ../sites-available/mcp.entscheidsuche.ch /etc/nginx/sites-enabled/
# TLS-Zertifikat per certbot:
#   certbot --nginx -d mcp.entscheidsuche.ch
#
# Streamable-HTTP-Transport benötigt:
#   - HTTP/1.1 mit Keep-Alive
#   - Längere Read-Timeouts (Server kann Streams offen halten)
#   - Kein Buffering, sonst werden Server-Sent-Events erst am Ende ausgeliefert

upstream entscheidsuche_mcp {
    server 127.0.0.1:8765;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.entscheidsuche.ch;

    # ACME-HTTP-01-Challenge (für certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = / {
        root /opt/entscheidsuche-mcp/deploy;
        try_files /index.html =404;
    }

    location = /robots.txt {
        root /opt/entscheidsuche-mcp/deploy;
        access_log off;
        log_not_found off;
    }

    location ^~ /.well-known/mcp {
        proxy_pass http://entscheidsuche_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # OAuth-Discovery: signalisiert MCP-Clients, dass keine Authentifizierung benötigt wird
    location = /.well-known/oauth-protected-resource {
        return 404 '{"error":"no_auth"}';
        add_header Content-Type application/json;
    }
    location = /.well-known/oauth-protected-resource/mcp {
        return 404 '{"error":"no_auth"}';
        add_header Content-Type application/json;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.entscheidsuche.ch;

    ssl_certificate     /etc/letsencrypt/live/mcp.entscheidsuche.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.entscheidsuche.ch/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location = / {
        root /opt/entscheidsuche-mcp/deploy;
        try_files /index.html =404;
    }

    location = /robots.txt {
        root /opt/entscheidsuche-mcp/deploy;
        access_log off;
        log_not_found off;
    }

    location ^~ /.well-known/mcp {
        proxy_pass http://entscheidsuche_mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # OAuth-Discovery: signalisiert MCP-Clients, dass keine Authentifizierung benötigt wird
    location = /.well-known/oauth-protected-resource {
        return 404 '{"error":"no_auth"}';
        add_header Content-Type application/json;
    }
    location = /.well-known/oauth-protected-resource/mcp {
        return 404 '{"error":"no_auth"}';
        add_header Content-Type application/json;
    }

    # MCP-Endpunkte (Streamable HTTP) — Pfad muss zu --path im systemd-Unit passen
    location /mcp {
        proxy_pass http://entscheidsuche_mcp;
        proxy_http_version 1.1;

        # Streaming-Eigenschaften
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # Header weiterreichen
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Timeouts: Streams können lange offen bleiben
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 30s;

        # Maximale Body-Größe für JSON-RPC
        client_max_body_size 4m;
    }

    # Optional: einfache Healthcheck-Route
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Optional: Rate-Limiting (Empfehlung: zone in /etc/nginx/nginx.conf definieren)
    # limit_req_zone $binary_remote_addr zone=mcp:10m rate=20r/s;
    # location /mcp { limit_req zone=mcp burst=40 nodelay; ... }

    access_log /var/log/nginx/mcp.entscheidsuche.ch.access.log;
    error_log  /var/log/nginx/mcp.entscheidsuche.ch.error.log warn;
}

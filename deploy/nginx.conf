# nginx-Konfiguration für mcp.entscheidsuche.ch
#
# Ablage:  /etc/nginx/sites-available/mcp.entscheidsuche.ch
# Aktivieren: ln -s ../sites-available/mcp.entscheidsuche.ch /etc/nginx/sites-enabled/
# TLS-Zertifikat per certbot:
#   certbot --nginx -d mcp.entscheidsuche.ch
#
# Streamable-HTTP-Transport benötigt:
#   - HTTP/1.1 mit Keep-Alive
#   - Längere Read-Timeouts (Server kann Streams offen halten)
#   - Kein Buffering, sonst werden Server-Sent-Events erst am Ende ausgeliefert
#
# Auslieferungs-Layout für statische Dateien
# (siehe Block "STATIC ASSETS" weiter unten):
#   /opt/entscheidsuche-mcp/deploy/index.html
#   /opt/entscheidsuche-mcp/deploy/robots.txt
#   /opt/entscheidsuche-mcp/deploy/well-known/oauth-protected-resource.json
#   /opt/entscheidsuche-mcp/deploy/well-known/mcp.json
#   /opt/entscheidsuche-mcp/deploy/well-known/agent-card.json

upstream entscheidsuche_mcp {
    server 127.0.0.1:8765;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Map: Accept-Header bei POST /mcp normalisieren.
# Manche MCP-Clients senden nur "application/json" — der FastMCP-Server
# beantwortet das standardmässig mit 406, da Streamable-HTTP grundsätzlich
# beides verlangt. Wir ergänzen "text/event-stream" transparent, wenn es
# noch fehlt; der Server-seitige JSON-Response-Modus (MCP_JSON_RESPONSE=true,
# siehe systemd-Unit) liefert dann eine reine JSON-Antwort zurück.
# ---------------------------------------------------------------------------
map $http_accept $mcp_accept {
    default                       $http_accept;
    "~*text/event-stream"         $http_accept;
    ""                            "application/json, text/event-stream";
    "*/*"                         "application/json, text/event-stream";
    "~*application/json"          "application/json, text/event-stream";
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.entscheidsuche.ch;

    # ACME-HTTP-01-Challenge (für certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Alles andere auf HTTPS umleiten.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.entscheidsuche.ch;

    ssl_certificate     /etc/letsencrypt/live/mcp.entscheidsuche.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.entscheidsuche.ch/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ------------------------------------------------------------------
    # STATIC ASSETS (Startseite, robots.txt, favicon, Apple-Icons)
    # ------------------------------------------------------------------
    location = / {
        # POST/PUT/DELETE auf Root → MCP-Endpunkt (klassischer Client-Fehler)
        limit_except GET HEAD {
            # 308 erhält Methode + Body (im Gegensatz zu 301/302)
            proxy_pass http://entscheidsuche_mcp/mcp;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Accept $mcp_accept;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
        }
        root /opt/entscheidsuche-mcp/deploy;
        try_files /index.html =404;
    }

    location = /robots.txt {
        root /opt/entscheidsuche-mcp/deploy;
        access_log off;
        log_not_found off;
    }

    # favicon und apple-touch-icons leer beantworten (204), damit Browser
    # nicht laufend 404-Logeinträge erzeugen.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }
    location ~ ^/apple-touch-icon(-precomposed)?(-[0-9]+x[0-9]+)?\.png$ {
        access_log off;
        log_not_found off;
        return 204;
    }

    # ------------------------------------------------------------------
    # OAUTH-DISCOVERY (RFC 9728 + MCP Authorization Spec)
    # ------------------------------------------------------------------
    # /.well-known/oauth-protected-resource liefert eine RFC-9728-konforme
    # JSON, die signalisiert: keine Authentifizierung notwendig. Damit
    # akzeptieren strenge MCP-Clients den Server, ohne dass sie weitere
    # OAuth-Schritte versuchen.
    location = /.well-known/oauth-protected-resource {
        default_type application/json;
        alias /opt/entscheidsuche-mcp/deploy/well-known/oauth-protected-resource.json;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /.well-known/oauth-protected-resource/mcp {
        default_type application/json;
        alias /opt/entscheidsuche-mcp/deploy/well-known/oauth-protected-resource.json;
        add_header Cache-Control "public, max-age=3600";
    }

    # /.well-known/oauth-authorization-server existiert nur bei Servern,
    # die einen Authorization Server betreiben — wir nicht. Damit Clients
    # erkennen, dass es sich nicht um einen Konfigurationsfehler handelt,
    # liefern wir eine eindeutige 404 mit JSON-Body aus.
    location = /.well-known/oauth-authorization-server {
        access_log off;
        default_type application/json;
        return 404 '{"error":"not_an_authorization_server","resource_metadata":"/.well-known/oauth-protected-resource"}';
    }
    location = /.well-known/oauth-authorization-server/mcp {
        access_log off;
        default_type application/json;
        return 404 '{"error":"not_an_authorization_server","resource_metadata":"/.well-known/oauth-protected-resource"}';
    }
    location = /mcp/.well-known/oauth-authorization-server {
        access_log off;
        default_type application/json;
        return 404 '{"error":"not_an_authorization_server","resource_metadata":"/.well-known/oauth-protected-resource"}';
    }

    # ------------------------------------------------------------------
    # MCP- und AGENT-DISCOVERY-MANIFESTE
    # ------------------------------------------------------------------
    # Werden von MCP-/Agent-Verzeichnissen (AgenstryBot, MCPScoringEngine,
    # relay-registry, agent-tools, montexi, mcpindex etc.) abgefragt.
    location = /.well-known/mcp.json {
        default_type application/json;
        alias /opt/entscheidsuche-mcp/deploy/well-known/mcp.json;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /.well-known/agent.json {
        default_type application/json;
        alias /opt/entscheidsuche-mcp/deploy/well-known/agent-card.json;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /.well-known/agent-card.json {
        default_type application/json;
        alias /opt/entscheidsuche-mcp/deploy/well-known/agent-card.json;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /.well-known/ai-plugin.json {
        default_type application/json;
        alias /opt/entscheidsuche-mcp/deploy/well-known/mcp.json;
        add_header Cache-Control "public, max-age=3600";
    }
    # Alias-Pfade für A2A-/Agent-Card-Discovery (Liste aus Logs):
    location = /agent { return 308 /.well-known/agent-card.json; }
    location = /agent-card.json { return 308 /.well-known/agent-card.json; }
    location = /agent.json { return 308 /.well-known/agent.json; }
    location = /v1/agent-card.json { return 308 /.well-known/agent-card.json; }
    location = /v1/agent.json { return 308 /.well-known/agent.json; }
    location = /v2/agent-card.json { return 308 /.well-known/agent-card.json; }
    location = /api/agent-card.json { return 308 /.well-known/agent-card.json; }
    location = /api/agent.json { return 308 /.well-known/agent.json; }
    location = /agents/agent-card.json { return 308 /.well-known/agent-card.json; }

    # ------------------------------------------------------------------
    # FastMCP-INTERNE WELL-KNOWN-ROUTEN (von der App ausgeliefert)
    # ------------------------------------------------------------------
    # FastMCP stellt unter /.well-known/mcp und /.well-known/mcp/server-card.json
    # eigene Manifeste bereit — diese unbedingt durchreichen.
    location ^~ /.well-known/mcp {
        proxy_pass http://entscheidsuche_mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # ------------------------------------------------------------------
    # PFAD-REDIRECTS (klassische MCP-Transport-Varianten)
    # ------------------------------------------------------------------
    # Manche Clients probieren ältere Streamable-HTTP-/SSE-Konventionen.
    # 308 statt 301, damit die Request-Methode (POST!) erhalten bleibt.
    location = /sse                { return 308 /mcp; }
    location = /mcp/sse            { return 308 /mcp; }
    location = /mcp/mcp            { return 308 /mcp; }
    location = /mcp/v1/mcp         { return 308 /mcp; }
    location = /mcp/api/mcp        { return 308 /mcp; }
    location = /mcp/openapi.json   { return 308 /.well-known/mcp.json; }

    # (POST auf "/" → 308 /mcp wird im obigen "location = /" Block über
    #  limit_except behandelt — siehe weiter unten Variante mit limit_except.)

    # ------------------------------------------------------------------
    # MCP-ENDPUNKT (Streamable HTTP)
    # ------------------------------------------------------------------
    # Pfad muss zu --path im systemd-Unit passen
    location /mcp {
        # Accept-Header normalisieren (siehe map oben) — verhindert 406er
        # bei MCP-Clients, die nur application/json akzeptieren.
        proxy_set_header Accept $mcp_accept;

        proxy_pass http://entscheidsuche_mcp;
        proxy_http_version 1.1;

        # Streaming-Eigenschaften
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # Header weiterreichen
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Timeouts: Streams können lange offen bleiben
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 30s;

        # Maximale Body-Größe für JSON-RPC
        client_max_body_size 4m;
    }

    # ------------------------------------------------------------------
    # HEALTHCHECK
    # ------------------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ------------------------------------------------------------------
    # Optional: Rate-Limiting (Empfehlung: zone in /etc/nginx/nginx.conf
    # definieren, z.B. limit_req_zone $binary_remote_addr zone=mcp:10m rate=20r/s;)
    # location /mcp { limit_req zone=mcp burst=40 nodelay; ... }
    # ------------------------------------------------------------------

    access_log /var/log/nginx/mcp.entscheidsuche.ch.access.log;
    error_log  /var/log/nginx/mcp.entscheidsuche.ch.error.log warn;
}

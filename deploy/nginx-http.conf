# Bootstrap-Nginx-Konfiguration für mcp.entscheidsuche.ch ohne TLS.
#
# Diese Datei dient nur für den ersten Schritt, damit:
#   1. nginx bereits auf Port 80 antwortet
#   2. certbot das Zertifikat holen kann
# Danach sollte auf deploy/nginx.conf umgestellt werden.

upstream entscheidsuche_mcp {
    server 127.0.0.1:8765;
    keepalive 32;
}

map $http_accept $mcp_accept {
    default                       $http_accept;
    "~*text/event-stream"         $http_accept;
    ""                            "application/json, text/event-stream";
    "*/*"                         "application/json, text/event-stream";
    "~*application/json"          "application/json, text/event-stream";
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.entscheidsuche.ch;

    # ACME-HTTP-01-Challenge (für certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ------------------------------------------------------------------
    # STATIC ASSETS
    # ------------------------------------------------------------------
    location = / {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 308 /mcp;
        }
        root /opt/entscheidsuche-mcp/deploy;
        try_files /index.html =404;
    }

    location = /robots.txt {
        root /opt/entscheidsuche-mcp/deploy;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }
    location ~ ^/apple-touch-icon(-[0-9]+x[0-9]+)?(-precomposed)?\.png$ {
        access_log off;
        log_not_found off;
        return 204;
    }

    location = /llms.txt {
        default_type text/plain;
        alias /opt/entscheidsuche-mcp/deploy/llms.txt;
        add_header Cache-Control "public, max-age=3600";
    }

    # ------------------------------------------------------------------
    # OAUTH-DISCOVERY
    # ------------------------------------------------------------------
    location = /.well-known/oauth-protected-resource {
        default_type application/json;
        alias /opt/entscheidsuche-mcp/deploy/well-known/oauth-protected-resource.json;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /.well-known/oauth-protected-resource/mcp {
        default_type application/json;
        alias /opt/entscheidsuche-mcp/deploy/well-known/oauth-protected-resource.json;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /.well-known/oauth-authorization-server {
        access_log off;
        default_type application/json;
        return 404 '{"error":"not_an_authorization_server","resource_metadata":"/.well-known/oauth-protected-resource"}';
    }
    location = /.well-known/oauth-authorization-server/mcp {
        access_log off;
        default_type application/json;
        return 404 '{"error":"not_an_authorization_server","resource_metadata":"/.well-known/oauth-protected-resource"}';
    }
    location = /mcp/.well-known/oauth-authorization-server {
        access_log off;
        default_type application/json;
        return 404 '{"error":"not_an_authorization_server","resource_metadata":"/.well-known/oauth-protected-resource"}';
    }

    # ------------------------------------------------------------------
    # MCP-/AGENT-DISCOVERY-MANIFESTE
    # ------------------------------------------------------------------
    location = /.well-known/mcp.json {
        default_type application/json;
        alias /opt/entscheidsuche-mcp/deploy/well-known/mcp.json;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /.well-known/agent.json {
        default_type application/json;
        alias /opt/entscheidsuche-mcp/deploy/well-known/agent-card.json;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /.well-known/agent-card.json {
        default_type application/json;
        alias /opt/entscheidsuche-mcp/deploy/well-known/agent-card.json;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /.well-known/ai-plugin.json {
        default_type application/json;
        alias /opt/entscheidsuche-mcp/deploy/well-known/mcp.json;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /agent { return 308 /.well-known/agent-card.json; }
    location = /agent-card.json { return 308 /.well-known/agent-card.json; }
    location = /agent.json { return 308 /.well-known/agent.json; }
    location = /v1/agent-card.json { return 308 /.well-known/agent-card.json; }
    location = /v1/agent.json { return 308 /.well-known/agent.json; }
    location = /v2/agent-card.json { return 308 /.well-known/agent-card.json; }
    location = /api/agent-card.json { return 308 /.well-known/agent-card.json; }
    location = /api/agent.json { return 308 /.well-known/agent.json; }
    location = /agents/agent-card.json { return 308 /.well-known/agent-card.json; }

    location ^~ /.well-known/mcp {
        proxy_pass http://entscheidsuche_mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # ------------------------------------------------------------------
    # PFAD-REDIRECTS
    # ------------------------------------------------------------------
    location = /sse                { return 308 /mcp; }
    location = /mcp/sse            { return 308 /mcp; }
    location = /mcp/mcp            { return 308 /mcp; }
    location = /mcp/v1/mcp         { return 308 /mcp; }
    location = /mcp/api/mcp        { return 308 /mcp; }
    location = /mcp/openapi.json   { return 308 /.well-known/mcp.json; }

    # ------------------------------------------------------------------
    # HEALTHCHECK
    # ------------------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ------------------------------------------------------------------
    # MCP-ENDPUNKT
    # ------------------------------------------------------------------
    location /mcp {
        proxy_set_header Accept $mcp_accept;
        proxy_pass http://entscheidsuche_mcp;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 30s;

        client_max_body_size 4m;
    }

    access_log /var/log/nginx/mcp.entscheidsuche.ch.access.log;
    error_log  /var/log/nginx/mcp.entscheidsuche.ch.error.log warn;
}

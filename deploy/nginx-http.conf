# Bootstrap-Nginx-Konfiguration für mcp.entscheidsuche.ch ohne TLS.
#
# Diese Datei dient nur für den ersten Schritt, damit:
#   1. nginx bereits auf Port 80 antwortet
#   2. certbot das Zertifikat holen kann
# Danach sollte auf deploy/nginx.conf umgestellt werden.

upstream entscheidsuche_mcp {
    server 127.0.0.1:8765;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.entscheidsuche.ch;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = / {
        root /opt/entscheidsuche-mcp/deploy;
        try_files /index.html =404;
    }

    location ^~ /.well-known/mcp {
        proxy_pass http://entscheidsuche_mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /mcp {
        proxy_pass http://entscheidsuche_mcp;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 30s;

        client_max_body_size 4m;
    }

    access_log /var/log/nginx/mcp.entscheidsuche.ch.access.log;
    error_log  /var/log/nginx/mcp.entscheidsuche.ch.error.log warn;
}

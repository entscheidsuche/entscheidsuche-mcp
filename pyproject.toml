[project]
name = "entscheidsuche-mcp"
version = "0.1.0"
description = "MCP-Server für entscheidsuche.ch — Volltextsuche in Schweizer Gerichtsentscheiden"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "entscheidsuche.ch" },
]
keywords = ["mcp", "entscheidsuche", "elasticsearch", "switzerland", "court", "decisions"]

dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
entscheidsuche-mcp = "entscheidsuche_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
